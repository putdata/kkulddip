stages:
  - build

build-job:
  stage: build
  image: gradle:8.14.3-jdk21
  script:
    - chmod +x ./gradlew
    - ./gradlew clean build --refresh-dependencies --no-build-cache --rerun-tasks
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: '$CI_COMMIT_BRANCH =~ /^(master|develop|S13P11A701-\d+)$/'