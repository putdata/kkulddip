# GitLab CI/CD 파이프라인 설정
image: oven/bun:1

# 캐시 설정으로 빌드 속도 향상
cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - frontend/node_modules/
    - frontend/apps/customer/node_modules/
    - frontend/apps/owner/node_modules/
    - frontend/packages/common/node_modules/

# 파이프라인 단계 정의
stages:
  - install
  - lint
  - format
  - build
  - deploy

# 의존성 설치
install_dependencies:
  stage: install
  script:
    - cd frontend
    - bun install
  artifacts:
    paths:
      - frontend/node_modules/
      - frontend/apps/customer/node_modules/
      - frontend/apps/owner/node_modules/
      - frontend/packages/common/node_modules/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# 린트 검사
lint_check:
  stage: lint
  script:
    - cd frontend
    - bun run lint
  dependencies:
    - install_dependencies
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# 포맷팅 검사
format_check:
  stage: format
  script:
    - cd frontend
    - bun run format:check
  dependencies:
    - install_dependencies
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# 빌드 테스트
build_project:
  stage: build
  script:
    - cd frontend
    - bun run build
  artifacts:
    paths:
      - frontend/apps/customer/dist/
      - frontend/apps/owner/dist/
      - frontend/packages/common/dist/
    expire_in: 1 week
  dependencies:
    - install_dependencies
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# 배포
deploy_to_server:
  stage: deploy
  script:
    - rsync -av --delete frontend/apps/customer/dist/ /var/www/kkulddip/customer/
    - rsync -av --delete frontend/apps/owner/dist/ /var/www/kkulddip/owner/
    
    - sudo chown -R www-data:www-data /var/www/kkulddip
  dependencies:
    - build_project
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
  environment:
    name: production
    url: https://kkulddip.store