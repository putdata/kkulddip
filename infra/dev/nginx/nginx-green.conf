upstream backend {
    server localhost:8082;
}

server {
    listen 80;
    server_name api.kkulddip.store;  # 모든 도메인 허용 (EC2 public IP 포함)

    # 로그 설정
    access_log /var/log/nginx/kkulddip-app.access.log;
    error_log /var/log/nginx/kkulddip-app.error.log;

    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 타임아웃 설정
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 버퍼링 설정
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
}

server {
  listen 127.0.0.1:18080;          # 외부 접근 불가
  server_name localhost;

  location = /actuator/prometheus {
    proxy_pass http://backend;     # 현재 활성 upstream (8081 또는 8082)
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
  }
}