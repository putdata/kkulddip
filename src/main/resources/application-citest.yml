server:
    address: 127.0.0.1
    port: 8080

# Override environment variables for CI/Test
spring:
    config:
        import: ""  # Disable .env import for tests
    main:
        allow-bean-definition-overriding: true
    datasource:
        url: jdbc:h2:mem:kkulddip-inmem-db;DATABASE_TO_UPPER=FALSE;mode=mysql
        username: sa
        password:
        driver-class-name: org.h2.Driver

    h2:
        console:
            enabled: true
            path: /h2-console

    servlet:
        multipart:
            max-file-size: 10MB
            max-request-size: 20MB

    jpa:
        show-sql: true
        hibernate:
            ddl-auto: create
            naming:
                physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        properties:
            hibernate:
                format_sql: true
                highlight_sql: true
                use_sql_comments: true
                dialect: org.hibernate.dialect.H2Dialect
        open-in-view: false

    data:
        redis:
            host: localhost
            port: 6379
            password:

    security:
        oauth2:
            client:
                registration:
                    google-customer:
                        provider: google
                        client-id: ci-test-client-id
                        client-secret: ci-test-client-secret
                        scope:
                            - email
                            - profile
                        redirect-uri: http://localhost:8080/login/oauth2/code/google
                        client-name: Google Customer Login
                    google-owner:
                        provider: google
                        client-id: ci-test-client-id
                        client-secret: ci-test-client-secret
                        scope:
                            - email
                            - profile
                        redirect-uri: http://localhost:8080/login/oauth2/code/google-owner
                        client-name: Google Owner Login
                provider:
                    google:
                        authorization-uri: https://accounts.google.com/o/oauth2/auth
                        token-uri: https://oauth2.googleapis.com/token
                        user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
                        user-name-attribute: id

    cloud:
        aws:
            credentials:
                access-key: test-access-key-AKIAIOSFODNN7EXAMPLE
                secret-key: test-secret-key-wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
            region:
                static: us-east-2
            s3:
                bucket: test-bucket-kkulddip

jwt:
    secret-key: ci-test-secret-key-for-jwt-token-signing-minimum-256-bits-required-for-hmac-sha256-algorithm
    access-token-expiration: 3600
    refresh-token-expiration: 86400

app:
    oauth2:
        success-redirect-url: http://localhost:5173/login-success
    cors:
        max-age-seconds: 3600

toss:
    payments:
        test-secret-key: test
        test-client-key: test
        base-url: https://api.tosspayments.com

openvidu:
    url: https://stream.kkulddip.store
    secret: MY_SECRET
        
firebase:
    service-account-key: ""
    project-id: ""

management:
    server:
        port: 8080

python:
    analytics:
        base-url: http://mock-server:8001  # 테스트용 Mock 서버