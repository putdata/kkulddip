server:
    address: 127.0.0.1
    port: 8080

spring:
    datasource:
        url: jdbc:h2:mem:kkulddip-inmem-db;DATABASE_TO_UPPER=FALSE;mode=mysql
        username: sa
        password:
        driver-class-name: org.h2.Driver
    
    h2:
        console:
            enabled: true
            path: /h2-console

    jpa:
        show-sql: true
        hibernate:
            ddl-auto: create

        properties:
            hibernate:
                format_sql: true
                highlight_sql: true
                use_sql_comments: true