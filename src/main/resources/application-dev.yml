server:
    address: 127.0.0.1
    port: 8080

spring:
    devtools:
        livereload:
            enabled: true
        restart:
            enabled: true

    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        show-sql: true
        properties:
            hibernate:
                format_sql: true
                highlight_sql: true
                use_sql_comments: true

logging:
    level:
        web: DEBUG



