server:
    address: 127.0.0.1
    port: 8080

spring:
    devtools:
        livereload:
            enabled: true
        restart:
            enabled: true

    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        show-sql: true
        properties:
            hibernate:
                format_sql: true
                highlight_sql: true
                use_sql_comments: true
    security:
        oauth2:
            client:
                registration:
                    google-customer:
                        provider: google
                        client-id: ${GOOGLE_OAUTH2_CLIENT_ID}
                        client-secret: ${GOOGLE_OAUTH2_CLIENT_SECRET}
                        scope:
                            - email
                            - profile
                        redirect-uri: ${GOOGLE_OAUTH2_REDIRECT_URI}
                        client-name: Google Customer Login
                    google-owner:
                        provider: google
                        client-id: ${GOOGLE_OAUTH2_CLIENT_ID}
                        client-secret: ${GOOGLE_OAUTH2_CLIENT_SECRET}
                        scope:
                            - email
                            - profile
                        redirect-uri: ${GOOGLE_OAUTH2_REDIRECT_URI_OWNER}
                        client-name: Google Owner Login
                provider:
                    google:
                        authorization-uri: https://accounts.google.com/o/oauth2/auth
                        token-uri: https://oauth2.googleapis.com/token
                        user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
                        user-name-attribute: id


jwt:
    secret-key: ${JWT_SECRET_KEY}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:86400}

app:
    oauth2:
        success-redirect-url: ${OAUTH2_SUCCESS_REDIRECT_URL:http://localhost:5173/login-success}
    cors:
        max-age-seconds: ${CORS_MAX_AGE_SECONDS:3600}

logging:
    level:
        web: DEBUG


management:
    health:
        show-details: always